$kind: http-request
name: Mark Notification as Read
order: 2000
method: PATCH
url: '{{baseUrl}}/api/notifications/:id/read'
pathVariables:
  - key: id
    value: '{{notificationId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status: 200 OK", () => {
        pm.response.to.have.status(200);
      });

      pm.test("Notification marked as read", () => {
        const res = pm.response.json();
        pm.expect(res.success).to.be.true;
        pm.expect(res.notification).to.have.property("isRead");
        pm.expect(res.notification.isRead).to.be.true;
      });
