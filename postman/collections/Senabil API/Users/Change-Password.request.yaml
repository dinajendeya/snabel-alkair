$kind: http-request
name: Change Password
order: 4000
method: PATCH
url: '{{baseUrl}}/api/users/me/password'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "Password123",
      "newPassword": "NewPassword456"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status: 200 OK", () => {
        pm.response.to.have.status(200);
      });

      pm.test("Password changed successfully", () => {
        const res = pm.response.json();
        pm.expect(res.success).to.be.true;
        pm.expect(res.message).to.include("Password changed");
      });
