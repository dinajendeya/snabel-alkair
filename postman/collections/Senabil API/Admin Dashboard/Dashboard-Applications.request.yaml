$kind: http-request
name: Dashboard Applications
order: 5000
method: GET
url: '{{baseUrl}}/api/dashboard/applications'
queryParams:
  - key: status
    value: PENDING
    description: 'PENDING | APPROVED | REJECTED'
    disabled: true
  - key: projectId
    value: '{{projectId}}'
    description: 'Filter by project UUID'
    disabled: true
  - key: role
    value: BENEFICIARY
    description: 'BENEFICIARY | VOLUNTEER'
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status: 200 OK", () => {
        pm.response.to.have.status(200);
      });

      pm.test("Applications returned", () => {
        const res = pm.response.json();
        pm.expect(res.success).to.be.true;
        pm.expect(res.applications).to.be.an("array");
      });
