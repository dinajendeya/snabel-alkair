$kind: http-request
name: Dashboard Overview
order: 1000
method: GET
url: '{{baseUrl}}/api/dashboard/overview'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status: 200 OK", () => {
        pm.response.to.have.status(200);
      });

      pm.test("Overview stats returned", () => {
        const res = pm.response.json();
        pm.expect(res.success).to.be.true;
        pm.expect(res.stats).to.have.all.keys(
          "totalProjects", "runningProjects", "pausedProjects", "completedProjects",
          "totalApplications", "pendingApplications", "approvedApplications",
          "rejectedApplications", "totalBeneficiaries", "totalVolunteers"
        );
      });

      pm.test("Category counts and recent activity included", () => {
        const res = pm.response.json();
        pm.expect(res.categoryCounts).to.be.an("array");
        pm.expect(res.recentAuditLogs).to.be.an("array");
        pm.expect(res.recentApplications).to.be.an("array");
      });
