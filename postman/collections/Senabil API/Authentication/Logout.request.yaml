$kind: http-request
name: Logout
order: 3000
method: POST
url: '{{baseUrl}}/api/auth/logout'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status: 200 OK", () => {
        pm.response.to.have.status(200);
      });

      pm.test("Logout successful", () => {
        const res = pm.response.json();
        pm.expect(res.success).to.be.true;
      });
