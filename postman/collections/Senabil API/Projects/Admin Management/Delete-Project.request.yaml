$kind: http-request
name: Delete Project
order: 3000
method: DELETE
url: '{{baseUrl}}/api/projects/:id'
pathVariables:
  - key: id
    value: '{{projectId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status: 200 OK", () => {
        pm.response.to.have.status(200);
      });

      pm.test("Project deleted", () => {
        const res = pm.response.json();
        pm.expect(res.success).to.be.true;
      });
