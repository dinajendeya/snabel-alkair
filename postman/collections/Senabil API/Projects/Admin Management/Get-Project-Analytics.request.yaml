$kind: http-request
name: Get Project Analytics
order: 5000
method: GET
url: '{{baseUrl}}/api/projects/:id/analytics'
pathVariables:
  - key: id
    value: '{{projectId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status: 200 OK", () => {
        pm.response.to.have.status(200);
      });

      pm.test("Analytics data returned", () => {
        const res = pm.response.json();
        pm.expect(res.success).to.be.true;
      });
